name: Build Scenario Images

on:
  push:
    branches: [main]
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # The stable scenario image also gets a unique tag per commit; merging the
  # manifest PR that CI opens deploys exactly that build through GitOps.
  STABLE_VERSION_TAG: stable-${{ github.sha }}

jobs:
  build-scenarios:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scenario:
          - name: stable
            tag: v1.stable
            version: "1.0.0"
            scenario_mode: success
            null_pointer: "false"
            memory_leak: "false"
            latency_drift: "false"
          - name: null-pointer-bug
            tag: v2.nullpointer
            version: "2.0.0"
            scenario_mode: null-pointer
            null_pointer: "true"
            memory_leak: "false"
            latency_drift: "false"
          - name: memory-leak
            tag: v3.memoryleak
            version: "3.0.0"
            scenario_mode: memory-leak
            null_pointer: "false"
            memory_leak: "true"
            latency_drift: "false"
          - name: latency-drift
            tag: v4.latency
            version: "4.0.0"
            scenario_mode: latency-drift
            null_pointer: "false"
            memory_leak: "false"
            latency_drift: "true"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Update application.properties for scenario
        run: |
          echo "Configuring scenario: ${{ matrix.scenario.name }}"
          sed -i "s/enable.null.pointer.bug=.*/enable.null.pointer.bug=${{ matrix.scenario.null_pointer }}/" src/main/resources/application.properties
          sed -i "s/enable.memory.leak=.*/enable.memory.leak=${{ matrix.scenario.memory_leak }}/" src/main/resources/application.properties
          sed -i "s/enable.connection.leak=.*/enable.connection.leak=false/" src/main/resources/application.properties
          sed -i "s/enable.cpu.spike=.*/enable.cpu.spike=false/" src/main/resources/application.properties
          sed -i "s/enable.latency.drift=.*/enable.latency.drift=${{ matrix.scenario.latency_drift }}/" src/main/resources/application.properties
          sed -i "s/scenario.mode=.*/scenario.mode=${{ matrix.scenario.scenario_mode }}/" src/main/resources/application.properties
          sed -i "s/app.version=.*/app.version=${{ matrix.scenario.version }}/" src/main/resources/application.properties
          sed -i "s/load.generator.enabled=.*/load.generator.enabled=true/" src/main/resources/application.properties
          echo "Updated application.properties:"
          cat src/main/resources/application.properties | grep "enable\."
          cat src/main/resources/application.properties | grep -E "scenario.mode|app.version|load.generator.enabled"
      
      - name: Build with Maven
        run: ./mvnw clean package -DskipTests
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and Push Docker Image
        run: |
          echo "Building Docker image for scenario: ${{ matrix.scenario.name }}"
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/argo-rollouts-quarkus-demo"
          TAGS="-t ${IMAGE_NAME}:${{ matrix.scenario.tag }} -t ${IMAGE_NAME}:${{ matrix.scenario.name }}-latest"
          # the stable build also carries the unique version tag the
          # manifest PR points at, so deploys are immutable and traceable
          if [ "${{ matrix.scenario.name }}" = "stable" ]; then
            TAGS="$TAGS -t ${IMAGE_NAME}:${{ env.STABLE_VERSION_TAG }}"
          fi
          docker build -f src/main/docker/Dockerfile.jvm $TAGS .
          
          echo "Pushing images to GitHub Container Registry..."
          for t in ${{ matrix.scenario.tag }} ${{ matrix.scenario.name }}-latest; do
            docker push ${IMAGE_NAME}:$t
          done
          if [ "${{ matrix.scenario.name }}" = "stable" ]; then
            docker push ${IMAGE_NAME}:${{ env.STABLE_VERSION_TAG }}
          fi
          
          echo "Successfully pushed images for scenario: ${{ matrix.scenario.name }}"
      
      - name: Image Summary
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/argo-rollouts-quarkus-demo"
          echo "### Scenario: ${{ matrix.scenario.name }} :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images pushed:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${IMAGE_NAME}:${{ matrix.scenario.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${IMAGE_NAME}:${{ matrix.scenario.name }}-latest\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ matrix.scenario.name }}" = "stable" ]; then
            echo "- \`${IMAGE_NAME}:${{ env.STABLE_VERSION_TAG }}\` (immutable, deployed via the manifest PR)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- NullPointerException Bug: \`${{ matrix.scenario.null_pointer }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Memory Leak: \`${{ matrix.scenario.memory_leak }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Latency Drift: \`${{ matrix.scenario.latency_drift }}\`" >> $GITHUB_STEP_SUMMARY

  # Opens a PR in the progressive-delivery repo pointing the demo rollout at
  # the immutable stable image built above. Merge it and Argo CD rolls the new
  # build out through the canary analysis — the full GitOps loop.
  # Requires the PROGRESSIVE_DELIVERY_TOKEN secret: a PAT with repo access to
  # kdubois/progressive-delivery (contents read/write, pull requests write).
  update-manifest:
    runs-on: ubuntu-latest
    needs: build-scenarios
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout progressive-delivery
        uses: actions/checkout@v7
        with:
          repository: kdubois/progressive-delivery
          token: ${{ secrets.PROGRESSIVE_DELIVERY_TOKEN }}

      - name: Update the demo rollout image
        run: |
          IMAGE="ghcr.io/kdubois/argo-rollouts-quarkus-demo:${{ env.STABLE_VERSION_TAG }}"
          sed -i "s|image: ghcr.io/kdubois/argo-rollouts-quarkus-demo:[^ ]*|image: ${IMAGE}|" \
            workloads/quarkus-rollouts-demo/base/rollout.yaml
          grep "image: ${IMAGE}" workloads/quarkus-rollouts-demo/base/rollout.yaml

      - name: Open manifest PR
        env:
          GH_TOKEN: ${{ secrets.PROGRESSIVE_DELIVERY_TOKEN }}
        run: |
          BRANCH="demo-${{ github.sha }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b "$BRANCH"
          git add workloads/quarkus-rollouts-demo/base/rollout.yaml
          git commit -m "Deploy demo build ${{ github.sha }}"
          git push origin "$BRANCH"
          gh pr create --title "Deploy demo build ${{ github.sha }}" \
            --body "Automated manifest update from kdubois/argo-rollouts-quarkus-demo@${{ github.sha }}.

          Merging this PR deploys the stable image \`stable-${{ github.sha }}\` through the canary rollout with AI analysis." \
            --head "$BRANCH"

